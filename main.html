<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MENTAL HEALTH DAY: LAMP LIGHTING</title>
<style>
:root{--bg:#021a16;--bg2:#0b3b34;--ink:#ffffff;--muted:#9cc4be;--brass:#6aa59d;--brass2:#3d7a72;--glow:255,170,60;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Palatino Linotype",serif;text-align:center;overflow-x:hidden}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;position:relative;
background:radial-gradient(ellipse at 50% 75%,rgba(var(--glow),var(--g,0)) 0%,transparent 55%),linear-gradient(var(--bg2),var(--bg));transition:--g 1s}
.stage.lit{--g:.35}
h1{font-size:clamp(1.5rem,5.5vw,3rem);letter-spacing:.04em;margin:0 0 10px;font-weight:700;line-height:1.2;max-width:900px}
.brand{display:flex;align-items:center;gap:14px;width:min(420px,90%);margin-bottom:18px;font-family:"Trebuchet MS",Arial,sans-serif;font-weight:700;letter-spacing:.12em}
.brand::before,.brand::after{content:"";flex:1;height:3px;background:var(--brass)}
.session{font-size:clamp(1.05rem,3.4vw,1.6rem);color:var(--brass);margin:0 0 14px;max-width:700px;line-height:1.35}
p.sub{color:var(--muted);margin:0 0 6px;font-size:1.05rem;min-height:3.2em;max-width:520px;transition:color .8s}
.lit p.sub{color:var(--ink)}
button.lamp{background:none;border:0;cursor:pointer;padding:0;margin-top:10px;-webkit-tap-highlight-color:transparent;border-radius:24px}
button.lamp:focus-visible{outline:3px solid var(--brass);outline-offset:6px}
svg{width:min(340px,80vw);height:auto;display:block;overflow:visible}
.flame{transform-origin:50% 100%;transform-box:fill-box;opacity:0;transform:scale(0);transition:opacity .9s,transform .9s}
.lit .flame{opacity:1;transform:scale(1);animation:flick 1.6s ease-in-out infinite alternate .9s}
.lit .flame.inner{animation-duration:1.1s}
.halo{opacity:0;transition:opacity 1.4s}
.lit .halo{opacity:1;animation:pulse 3s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-1.5deg)}50%{transform:scale(.94,1.07) rotate(1.5deg)}100%{transform:scale(1.04,.96) rotate(-1deg)}}
@keyframes pulse{from{opacity:.75}to{opacity:1}}
.hint{margin-top:14px;font-size:.95rem;color:var(--brass)}
.reset{margin-top:16px;background:none;color:var(--muted);border:1px solid var(--muted);border-radius:999px;padding:8px 18px;font:inherit;cursor:pointer;visibility:hidden}
.lit .reset{visibility:visible}
.reset:focus-visible{outline:3px solid var(--brass)}
@media (prefers-reduced-motion:reduce){.lit .flame,.lit .halo{animation:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="brand">SMiLE DTU</div>
  <h1>MENTAL HEALTH DAY: LAMP LIGHTING</h1>
  <p class="session">Session: Design Your Happy Life: Flourishing with Strengths</p>
  <p class="sub" id="msg">Take a breath. Click the lamp to begin.</p>

  <button class="lamp" id="lamp" aria-pressed="false" aria-label="Light the ceremonial lamp">
  <svg viewBox="0 0 300 300" role="img" aria-hidden="true">
    <defs>
      <radialGradient id="halo"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".5" stop-color="#ff9a2e" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/></radialGradient>
      <linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#3d7a72"/><stop offset=".35" stop-color="#a9d6cf"/><stop offset=".7" stop-color="#6aa59d"/><stop offset="1" stop-color="#2f625b"/></linearGradient>
      <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset=".6" stop-color="#ffb21e"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
    </defs>
    <circle class="halo" cx="150" cy="110" r="140" fill="url(#halo)"/>
    <!-- stand -->
    <ellipse cx="150" cy="282" rx="70" ry="10" fill="url(#brass)"/>
    <path d="M128 282 L136 232 L164 232 L172 282Z" fill="url(#brass)"/>
    <rect x="140" y="196" width="20" height="40" rx="6" fill="url(#brass)"/>
    <ellipse cx="150" cy="196" rx="30" ry="8" fill="#6aa59d"/>
    <!-- diya bowl -->
    <path d="M60 150 Q150 270 240 150 Q200 164 150 164 Q100 164 60 150Z" fill="url(#brass)"/>
    <path d="M232 152 Q262 140 270 120 Q250 126 228 142Z" fill="url(#brass)"/>
    <ellipse cx="150" cy="152" rx="90" ry="14" fill="#03231e"/>
    <ellipse cx="150" cy="152" rx="80" ry="10" fill="#8fc3bb" opacity=".85"/>
    <!-- wick -->
    <rect x="147" y="132" width="6" height="22" rx="3" fill="#4a2c0f"/>
    <!-- flame -->
    <path class="flame" d="M150 40 C170 70 182 92 176 114 C172 130 162 134 150 134 C138 134 128 130 124 114 C118 92 134 74 150 40Z" fill="url(#fl)"/>
    <path class="flame inner" d="M150 82 C160 98 164 110 160 122 C157 130 154 132 150 132 C146 132 143 130 140 122 C136 110 142 98 150 82Z" fill="#fff6c9"/>
  </svg>
  </button>

  <div class="hint" id="hint">Click to light the lamp</div>
  <button class="reset" id="reset">Extinguish and start again</button>
</main>
<script>
(function(){
  var stage=document.getElementById('stage'),lamp=document.getElementById('lamp'),
      msg=document.getElementById('msg'),hint=document.getElementById('hint');
  function set(on){
    stage.classList.toggle('lit',on);
    lamp.setAttribute('aria-pressed',on);
    msg.textContent=on?"May this light remind us that even the smallest act of kindness can illuminate someone's world.":"Take a breath. Click the lamp to begin.";
    hint.textContent=on?"Here's to great beginnings!":"Click to light the lamp";
  }
  lamp.addEventListener('click',function(){ if(!stage.classList.contains('lit')) set(true); });
  document.getElementById('reset').addEventListener('click',function(){ set(false); });
})();
</script>
</body>
</html>
